services:
  capivara_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capivara_app
    restart: always
    depends_on:
      capivara_db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-troque-esta-chave-em-producao}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      INITDB_CREATE_DATABASE: ${INITDB_CREATE_DATABASE:-true}
      INITDB_ALTER: ${INITDB_ALTER:-true}
      DB_HOST: capivara_db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-capivara}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-30mariafn@}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://capivara.aporttec.com}
    networks:
      - traefik
      - capivara_internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.http.routers.capivara.rule: "Host(`capivara.aporttec.com`)"
      traefik.http.routers.capivara.entrypoints: "web,websecure"
      traefik.http.routers.capivara.middlewares: "capivara-https-redirect"
      traefik.http.middlewares.capivara-https-redirect.redirectscheme.scheme: "https"
      traefik.http.middlewares.capivara-https-redirect.redirectscheme.permanent: "true"
      traefik.http.routers.capivara-secure.rule: "Host(`capivara.aporttec.com`)"
      traefik.http.routers.capivara-secure.entrypoints: "websecure"
      traefik.http.routers.capivara-secure.tls: "true"
      traefik.http.routers.capivara-secure.tls.certresolver: "myresolver"
      traefik.http.services.capivara.loadbalancer.server.port: "3000"
      traefik.docker.network: traefik

  capivara_db:
    image: mariadb:11.4
    container_name: capivara_db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-30mariafn@}
      MARIADB_DATABASE: ${DB_NAME:-capivara}
      MARIADB_ROOT_HOST: ${DB_ROOT_HOST:-%}
    volumes:
      - capivara_db_data:/var/lib/mysql
    command:
      - --innodb-buffer-pool-size=256M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - capivara_internal
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p\"$${MARIADB_ROOT_PASSWORD}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  capivara_db_bootstrap:
    image: mariadb:11.4
    container_name: capivara_db_bootstrap
    restart: "no"
    depends_on:
      capivara_db:
        condition: service_healthy
    network_mode: "service:capivara_db"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-30mariafn@}
      DB_NAME: ${DB_NAME:-capivara}
    command:
      - /bin/sh
      - -ec
      - |
        set -eu

        until mariadb-admin ping -h 127.0.0.1 -uroot -p"$$MARIADB_ROOT_PASSWORD" --silent; do
          sleep 2
        done

        mariadb -h 127.0.0.1 -uroot -p"$$MARIADB_ROOT_PASSWORD" -e "CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY '$$MARIADB_ROOT_PASSWORD'; ALTER USER 'root'@'%' IDENTIFIED BY '$$MARIADB_ROOT_PASSWORD'; GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"

        mariadb -h 127.0.0.1 -uroot -p"$$MARIADB_ROOT_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS \`$$DB_NAME\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

  capivara_phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: capivara_phpmyadmin
    restart: always
    depends_on:
      capivara_db_bootstrap:
        condition: service_completed_successfully
      capivara_db:
        condition: service_healthy
    environment:
      PMA_HOST: capivara_db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      PMA_ABSOLUTE_URI: https://phpmyadmin.capivara.aporttec.com/
      UPLOAD_LIMIT: 64M
    networks:
      - traefik
      - capivara_internal
    labels:
      traefik.enable: "true"
      traefik.http.routers.capivara-pma.rule: "Host(`phpmyadmin.capivara.aporttec.com`)"
      traefik.http.routers.capivara-pma.entrypoints: "web,websecure"
      traefik.http.routers.capivara-pma.middlewares: "capivara-pma-https-redirect"
      traefik.http.middlewares.capivara-pma-https-redirect.redirectscheme.scheme: "https"
      traefik.http.middlewares.capivara-pma-https-redirect.redirectscheme.permanent: "true"
      traefik.http.routers.capivara-pma-secure.rule: "Host(`phpmyadmin.capivara.aporttec.com`)"
      traefik.http.routers.capivara-pma-secure.entrypoints: "websecure"
      traefik.http.routers.capivara-pma-secure.tls: "true"
      traefik.http.routers.capivara-pma-secure.tls.certresolver: "myresolver"
      traefik.http.services.capivara-pma.loadbalancer.server.port: "80"
      traefik.docker.network: traefik

networks:
  traefik:
    external: true
    name: traefik
  capivara_internal:
    driver: bridge

volumes:
  capivara_db_data: