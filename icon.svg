<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="24" fill="#166534"/>
  <!-- Capivara Head centered in 100x100 -->
  <g transform="translate(0, 5)">
    <!-- Orelhas -->
    <ellipse cx="36" cy="24" rx="5" ry="7" fill="#C07335" transform="rotate(-15 36 24)" />
    <ellipse cx="64" cy="24" rx="5" ry="7" fill="#C07335" transform="rotate(15 64 24)" />
    <ellipse cx="36" cy="24" rx="3" ry="5" fill="#593617" transform="rotate(-15 36 24)" />
    <ellipse cx="64" cy="24" rx="3" ry="5" fill="#593617" transform="rotate(15 64 24)" />

    <!-- Cabeça -->
    <path d="M36,27 C28,29 26,42 29,51 C31,57 36,60 50,60 C64,60 69,57 71,51 C74,42 72,29 64,27 C56,25 44,25 36,27 Z" fill="#C07335" />

    <!-- Bochechas -->
    <ellipse cx="34" cy="44" rx="4" ry="2.2" fill="#F87171" opacity="0.3" />
    <ellipse cx="66" cy="44" rx="4" ry="2.2" fill="#F87171" opacity="0.3" />

    <!-- Focinho -->
    <path d="M42,45 C42,39 46,37 50,37 C54,37 58,39 58,45 C58,51 54,53 50,53 C46,53 42,51 42,45 Z" fill="#593617" />
    <ellipse cx="47" cy="44" rx="1" ry="1.7" fill="#2B1607" />
    <ellipse cx="53" cy="44" rx="1" ry="1.7" fill="#2B1607" />

    <!-- Olhos -->
    <circle cx="36" cy="37" r="2.7" fill="#1A1A1A" />
    <circle cx="64" cy="37" r="2.7" fill="#1A1A1A" />
    <circle cx="37" cy="36" r="1.1" fill="#FFFFFF" />
    <circle cx="65" cy="36" r="1.1" fill="#FFFFFF" />

    <!-- Sorriso e Dente -->
    <path d="M46,55 Q50,57.5 54,55" fill="none" stroke="#3D2005" stroke-width="1.2" stroke-linecap="round" />
    <rect x="49.2" y="55.2" width="1.6" height="1.2" fill="#FFFFFF" rx="0.3" />
  </g>
</svg>
